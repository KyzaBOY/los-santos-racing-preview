<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Los Santos Racing Tablet Preview</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07090c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;align-items:center;justify-content:center;color:#fff;background:
 radial-gradient(circle at 22% 18%,rgba(255,64,84,.10),transparent 29%),
 radial-gradient(circle at 76% 78%,rgba(63,78,104,.13),transparent 34%),
 linear-gradient(135deg,#080a0e,#030405 70%)}
.preview-ambient{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.preview-ambient::before{content:"";position:absolute;inset:-25%;background-image:linear-gradient(rgba(255,255,255,.016) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.016) 1px,transparent 1px);background-size:54px 54px;transform:perspective(900px) rotateX(64deg) translateY(35%);opacity:.45}
.preview-ambient::after{content:"LOS SANTOS RACING  /  PRIVATE TABLET PREVIEW";position:absolute;left:24px;bottom:20px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:9px;letter-spacing:.24em;color:rgba(255,255,255,.22)}
.preview-stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.preview-device{--scale:1;width:1068px;height:812px;position:relative;flex:none;transform:scale(var(--scale));transform-origin:center;opacity:0;animation:deviceIn .75s cubic-bezier(.22,.9,.24,1) .08s forwards}
@keyframes deviceIn{from{opacity:0;transform:scale(var(--scale)) translateY(24px)}to{opacity:1;transform:scale(var(--scale)) translateY(0)}}
.preview-case{position:absolute;inset:0;border-radius:42px;background:linear-gradient(145deg,#181a1d,#070809 60%,#151619);box-shadow:0 55px 120px rgba(0,0,0,.72),0 0 0 1px #272a2e,inset 0 0 0 1px rgba(255,255,255,.055)}
.preview-case::before{content:"";position:absolute;left:30px;right:30px;top:5px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.11),transparent)}
.preview-power{position:absolute;right:74px;top:-4px;width:58px;height:4px;border-radius:3px;background:#202226;box-shadow:0 -1px 0 #060708}
.preview-camera{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:#050607;box-shadow:inset 0 0 0 2px #171a1e,0 0 8px rgba(69,101,148,.18)}
.preview-screen{--st-h:34px;position:absolute;left:22px;top:22px;width:1024px;height:768px;border-radius:22px;overflow:hidden;background:#080a0d;clip-path:inset(0 round 22px);isolation:isolate;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.preview-status{position:absolute;z-index:90;left:0;right:0;top:0;height:34px;padding:8px 24px 0;display:flex;align-items:flex-start;font-size:12px;font-weight:600;color:rgba(255,255,255,.9);pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.65)}
.preview-status .day{margin-left:7px;color:rgba(255,255,255,.55);font-weight:500}.preview-status .spacer{flex:1}.preview-status .right{display:flex;align-items:center;gap:8px}.preview-wifi{width:15px;height:11px;position:relative}.preview-wifi::before,.preview-wifi::after{content:"";position:absolute;left:50%;transform:translateX(-50%);border:1.5px solid #fff;border-left-color:transparent;border-right-color:transparent;border-bottom-color:transparent;border-radius:50%}.preview-wifi::before{width:15px;height:12px;top:1px}.preview-wifi::after{width:8px;height:7px;top:5px}.preview-wifi i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;left:6px;bottom:0}.preview-battery{width:25px;height:11px;border:1.4px solid rgba(255,255,255,.9);border-radius:3px;padding:1px;position:relative}.preview-battery::after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:4px;border-radius:0 1px 1px 0;background:rgba(255,255,255,.8)}.preview-battery i{display:block;width:100%;height:100%;border-radius:1px;background:#fff}
.preview-root{position:absolute;inset:0}
.preview-homebar{position:absolute;z-index:95;left:50%;bottom:6px;transform:translateX(-50%);width:220px;height:5px;border-radius:5px;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.45);pointer-events:none}
.preview-toast{position:absolute;z-index:100;left:50%;bottom:24px;transform:translate(-50%,10px);opacity:0;min-width:160px;max-width:62%;padding:9px 16px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(12,15,19,.96);font-size:11px;font-weight:650;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.52);transition:opacity .18s,transform .2s;pointer-events:none}.preview-toast.is-on{opacity:1;transform:translate(-50%,0)}
.rotate-hint{position:fixed;top:14px;left:50%;transform:translateX(-50%);padding:7px 12px;border:1px solid rgba(255,255,255,.08);border-radius:999px;background:rgba(255,255,255,.035);font-size:9px;letter-spacing:.08em;color:rgba(255,255,255,.45);opacity:0;transition:opacity .2s;pointer-events:none}
@media (orientation:portrait) and (max-width:700px){.rotate-hint{opacity:1}.preview-ambient::after{display:none}}

/* ============================================================
   Los Santos Racing — tablet-only app for Crest M-OS.
   The app is intentionally scoped under .lsr so it cannot leak into
   other M-OS screens. Built for the 1024x768 landscape tablet surface.
   ============================================================ */

.lsr{
  --lsr-bg:#080a0d;
  --lsr-panel:#101318;
  --lsr-panel-2:#15191f;
  --lsr-panel-3:#1b2027;
  --lsr-line:rgba(255,255,255,.085);
  --lsr-line-strong:rgba(255,255,255,.16);
  --lsr-text:#f4f5f7;
  --lsr-muted:rgba(244,245,247,.53);
  --lsr-faint:rgba(244,245,247,.3);
  --lsr-red:#ff4054;
  --lsr-red-soft:rgba(255,64,84,.16);
  --lsr-red-deep:#2b1016;
  --lsr-signal:#e5ff70;
  --lsr-green:#6cf2a7;
  --lsr-amber:#ffb85c;
  --lsr-blue:#80adff;
  --lsr-mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  position:absolute;
  inset:0;
  display:grid;
  grid-template-columns:104px minmax(0,1fr);
  padding-top:var(--st-h,34px);
  background:
    radial-gradient(circle at 84% 8%,rgba(255,64,84,.08),transparent 28%),
    radial-gradient(circle at 30% 110%,rgba(106,122,145,.08),transparent 38%),
    var(--lsr-bg);
  color:var(--lsr-text);
  overflow:hidden;
  isolation:isolate;
}

.lsr::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  opacity:.22;
  background-image:
    linear-gradient(rgba(255,255,255,.017) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.017) 1px,transparent 1px);
  background-size:32px 32px;
  -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.85),transparent 84%);
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.85),transparent 84%);
}

.lsr *{box-sizing:border-box}
.lsr button,.lsr input{font:inherit}
.lsr button{color:inherit}

/* ---------- navigation rail ---------- */
.lsr-rail{
  position:relative;
  min-height:0;
  padding:18px 12px 16px;
  display:flex;
  flex-direction:column;
  align-items:center;
  border-right:1px solid var(--lsr-line);
  background:rgba(8,10,13,.91);
}
.lsr-rail::after{
  content:"PRIVATE NETWORK";
  position:absolute;
  right:-31px;
  bottom:96px;
  transform:rotate(-90deg);
  transform-origin:center;
  font-family:var(--lsr-mono);
  font-size:7px;
  letter-spacing:.34em;
  color:rgba(255,255,255,.12);
  white-space:nowrap;
  pointer-events:none;
}
.lsr-logo{
  width:74px;
  height:54px;
  border:0;
  background:transparent;
  padding:0;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  line-height:1;
}
.lsr-logo-main{
  font-family:Arial Black,"Arial Narrow",sans-serif;
  font-size:27px;
  font-style:italic;
  font-weight:900;
  letter-spacing:-.16em;
  padding-right:.16em;
  transform:skewX(-9deg);
  text-shadow:0 0 22px rgba(255,255,255,.08);
}
.lsr-logo-sub{
  margin-top:5px;
  font-family:var(--lsr-mono);
  font-size:6.5px;
  font-weight:700;
  letter-spacing:.24em;
  color:var(--lsr-muted);
}
.lsr-nav{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:5px;
  margin-top:20px;
}
.lsr-nav-btn{
  position:relative;
  min-height:68px;
  border:1px solid transparent;
  border-radius:10px;
  background:transparent;
  padding:8px 4px 7px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  color:rgba(244,245,247,.38);
  cursor:pointer;
  transition:background .18s,border-color .18s,color .18s,transform .18s;
}
.lsr-nav-btn svg{width:21px;height:21px;display:block}
.lsr-nav-btn span{
  font-size:9px;
  font-weight:650;
  letter-spacing:.035em;
}
.lsr-nav-btn:hover{
  background:rgba(255,255,255,.035);
  color:rgba(244,245,247,.75);
}
.lsr-nav-btn:active{transform:scale(.97)}
.lsr-nav-btn.is-active{
  color:var(--lsr-text);
  background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));
  border-color:rgba(255,255,255,.08);
}
.lsr-nav-btn.is-active::before{
  content:"";
  position:absolute;
  left:-13px;
  width:3px;
  height:30px;
  border-radius:0 4px 4px 0;
  background:var(--lsr-red);
  box-shadow:0 0 16px rgba(255,64,84,.5);
}
.lsr-rail-foot{
  margin-top:auto;
  width:76px;
  border-top:1px solid var(--lsr-line);
  padding-top:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-family:var(--lsr-mono);
  font-size:7px;
  letter-spacing:.16em;
  color:var(--lsr-muted);
}
.lsr-net-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--lsr-green);
  box-shadow:0 0 11px rgba(108,242,167,.75);
}

/* ---------- stage / header ---------- */
.lsr-stage{min-width:0;min-height:0;display:flex;flex-direction:column}
.lsr-topbar{
  flex:none;
  height:68px;
  padding:0 24px;
  display:flex;
  align-items:center;
  gap:17px;
  border-bottom:1px solid var(--lsr-line);
  background:rgba(8,10,13,.68);
}
.lsr-titleblock{min-width:0}
.lsr-kicker{
  display:flex;
  align-items:center;
  gap:7px;
  font-family:var(--lsr-mono);
  font-size:8px;
  font-weight:700;
  letter-spacing:.2em;
  color:var(--lsr-red);
  text-transform:uppercase;
}
.lsr-kicker::before{
  content:"";
  width:13px;height:1px;background:currentColor;
}
.lsr-page-title{
  margin-top:4px;
  font-size:18px;
  font-weight:720;
  letter-spacing:-.025em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.lsr-top-spacer{flex:1}
.lsr-signal-pill{
  height:34px;
  padding:0 12px;
  border:1px solid var(--lsr-line);
  border-radius:999px;
  display:flex;
  align-items:center;
  gap:8px;
  background:rgba(255,255,255,.025);
  font-family:var(--lsr-mono);
  font-size:8px;
  letter-spacing:.14em;
  color:var(--lsr-muted);
  white-space:nowrap;
}
.lsr-signal-bars{display:flex;align-items:flex-end;gap:2px;height:11px}
.lsr-signal-bars i{width:2px;background:var(--lsr-green);border-radius:2px;display:block}
.lsr-signal-bars i:nth-child(1){height:4px;opacity:.45}
.lsr-signal-bars i:nth-child(2){height:7px;opacity:.7}
.lsr-signal-bars i:nth-child(3){height:10px}
.lsr-icon-btn{
  width:36px;height:36px;
  border:1px solid var(--lsr-line);
  border-radius:10px;
  background:rgba(255,255,255,.025);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  color:rgba(244,245,247,.67);
  transition:background .18s,color .18s,border-color .18s;
}
.lsr-icon-btn svg{width:17px;height:17px}
.lsr-icon-btn:hover{background:rgba(255,255,255,.07);color:#fff;border-color:var(--lsr-line-strong)}
.lsr-icon-btn.is-hot{color:var(--lsr-red);background:var(--lsr-red-soft);border-color:rgba(255,64,84,.24)}
.lsr-profile-chip{
  display:flex;
  align-items:center;
  gap:10px;
  padding-left:2px;
  cursor:pointer;
}
.lsr-avatar{
  width:36px;height:36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.16);
  background:
    radial-gradient(circle at 65% 25%,rgba(255,255,255,.26),transparent 27%),
    linear-gradient(145deg,#4c2630,#15181d 65%);
  color:#fff;
  font-weight:750;
  font-size:12px;
}
.lsr-profile-copy{display:flex;flex-direction:column;gap:1px;min-width:0}
.lsr-profile-copy b{font-size:11px;font-weight:650;white-space:nowrap}
.lsr-profile-copy span{font-family:var(--lsr-mono);font-size:7px;color:var(--lsr-muted);letter-spacing:.08em}

/* ---------- shared content ---------- */
.lsr-view{
  min-height:0;
  flex:1;
  position:relative;
  overflow:hidden;
}
.lsr-scroll{
  position:absolute;
  inset:0;
  overflow:auto;
  padding:20px 22px 30px;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.14) transparent;
}
.lsr-scroll::-webkit-scrollbar{width:5px;height:5px}
.lsr-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}
.lsr-scroll::-webkit-scrollbar-track{background:transparent}
.lsr-view-enter{animation:lsr-view-in .28s cubic-bezier(.2,.78,.25,1)}
@keyframes lsr-view-in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.lsr-row{display:flex;align-items:center}
.lsr-section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:13px}
.lsr-section-head h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.lsr-section-head p{margin:4px 0 0;font-size:10px;color:var(--lsr-muted)}
.lsr-section-code{
  font-family:var(--lsr-mono);
  font-size:7.5px;
  letter-spacing:.14em;
  color:var(--lsr-faint);
  text-transform:uppercase;
}
.lsr-card{
  position:relative;
  border:1px solid var(--lsr-line);
  border-radius:12px;
  background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.016)),var(--lsr-panel);
  overflow:hidden;
}
.lsr-card::after{
  content:"";
  position:absolute;
  left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);
  opacity:.55;
  pointer-events:none;
}
.lsr-tag{
  display:inline-flex;
  align-items:center;
  min-height:21px;
  padding:0 7px;
  border:1px solid var(--lsr-line-strong);
  border-radius:5px;
  font-family:var(--lsr-mono);
  font-size:7px;
  font-weight:700;
  letter-spacing:.11em;
  color:rgba(244,245,247,.67);
  text-transform:uppercase;
  white-space:nowrap;
}
.lsr-tag.is-live{color:var(--lsr-signal);border-color:rgba(229,255,112,.35);background:rgba(229,255,112,.08)}
.lsr-tag.is-red{color:#ff8f9a;border-color:rgba(255,64,84,.34);background:rgba(255,64,84,.1)}
.lsr-tag.is-green{color:var(--lsr-green);border-color:rgba(108,242,167,.3);background:rgba(108,242,167,.08)}
.lsr-tag.is-blue{color:#aec7ff;border-color:rgba(128,173,255,.32);background:rgba(128,173,255,.08)}
.lsr-tag.is-amber{color:#ffd18d;border-color:rgba(255,184,92,.34);background:rgba(255,184,92,.08)}
.lsr-btn{
  min-height:38px;
  border:1px solid var(--lsr-line-strong);
  border-radius:9px;
  background:rgba(255,255,255,.035);
  padding:0 15px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  cursor:pointer;
  font-size:10px;
  font-weight:680;
  letter-spacing:.01em;
  transition:transform .16s,background .16s,border-color .16s,opacity .16s;
}
.lsr-btn svg{width:15px;height:15px}
.lsr-btn:hover{background:rgba(255,255,255,.075);border-color:rgba(255,255,255,.25)}
.lsr-btn:active{transform:scale(.975)}
.lsr-btn:disabled{opacity:.35;cursor:default}
.lsr-btn.is-primary{
  background:var(--lsr-text);
  color:#0a0c0f;
  border-color:var(--lsr-text);
  box-shadow:0 10px 30px rgba(0,0,0,.24);
}
.lsr-btn.is-primary:hover{background:#fff;border-color:#fff}
.lsr-btn.is-danger{background:var(--lsr-red);border-color:var(--lsr-red);color:#fff}
.lsr-btn.is-danger:hover{background:#ff586a;border-color:#ff586a}
.lsr-btn.is-quiet{border-color:transparent;background:transparent;color:var(--lsr-muted);padding-left:8px;padding-right:8px}
.lsr-btn.is-quiet:hover{color:#fff;background:rgba(255,255,255,.04);border-color:transparent}
.lsr-btn.is-wide{width:100%}
.lsr-ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- home ---------- */
.lsr-home-grid{
  display:grid;
  grid-template-columns:minmax(0,1.55fr) minmax(280px,.86fr);
  gap:14px;
}
.lsr-hero{
  min-height:376px;
  position:relative;
  overflow:hidden;
  border-radius:15px;
  border:1px solid var(--lsr-line);
  background:#101317;
  isolation:isolate;
}
.lsr-photo{
  background-color:#14181e;
  background-size:cover;

.lsr-hero-media{position:absolute;inset:0;z-index:-3}
.lsr-hero::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-2;
  background:
    linear-gradient(90deg,rgba(5,7,9,.94) 0%,rgba(5,7,9,.72) 42%,rgba(5,7,9,.18) 72%,rgba(5,7,9,.45) 100%),
    linear-gradient(0deg,rgba(5,7,9,.9) 0%,transparent 58%);
}
.lsr-hero::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    repeating-linear-gradient(90deg,transparent 0 78px,rgba(255,255,255,.025) 79px 80px),
    linear-gradient(120deg,transparent 57%,rgba(255,64,84,.12) 58%,transparent 61%);
  mix-blend-mode:screen;
}
.lsr-hero-copy{
  position:absolute;
  left:24px;
  top:24px;
  bottom:22px;
  width:54%;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
}
.lsr-hero-eyebrow{display:flex;align-items:center;gap:8px}
.lsr-pulse{
  width:6px;height:6px;border-radius:50%;background:var(--lsr-red);
  box-shadow:0 0 0 0 rgba(255,64,84,.55);
  animation:lsr-pulse 1.8s infinite;
}
@keyframes lsr-pulse{70%{box-shadow:0 0 0 8px rgba(255,64,84,0)}100%{box-shadow:0 0 0 0 rgba(255,64,84,0)}}
.lsr-hero-title{
  margin:17px 0 8px;
  font-size:38px;
  line-height:.96;
  letter-spacing:-.055em;
  font-weight:820;
  text-transform:uppercase;
  max-width:420px;
}
.lsr-hero-title em{font-style:normal;color:var(--lsr-red)}
.lsr-hero-sub{
  max-width:360px;
  font-size:11px;
  line-height:1.55;
  color:rgba(244,245,247,.64);
}
.lsr-hero-stats{display:flex;align-items:center;gap:20px;margin-top:18px}
.lsr-hero-stat{display:flex;flex-direction:column;gap:3px}
.lsr-hero-stat span{font-family:var(--lsr-mono);font-size:7px;letter-spacing:.12em;color:var(--lsr-muted);text-transform:uppercase}
.lsr-hero-stat b{font-family:var(--lsr-mono);font-size:13px;font-weight:680}
.lsr-hero-actions{display:flex;gap:9px;margin-top:auto}
.lsr-route-card{
  position:absolute;
  right:20px;
  top:20px;
  width:210px;
  height:120px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:11px;
  background:rgba(5,7,9,.62);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  overflow:hidden;
}
.lsr-route-card::before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.18;
  background-image:
    linear-gradient(rgba(255,255,255,.16) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.16) 1px,transparent 1px);
  background-size:20px 20px;
}
.lsr-route-card svg{position:absolute;inset:12px;width:calc(100% - 24px);height:calc(100% - 24px);overflow:visible}
.lsr-route-card path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px rgba(255,255,255,.22))}
.lsr-route-card circle.is-start{fill:var(--lsr-red);stroke:#fff;stroke-width:2}
.lsr-route-card circle.is-end{fill:var(--lsr-signal);stroke:#090b0e;stroke-width:2}
.lsr-hero-code{
  position:absolute;
  right:20px;
  bottom:20px;
  width:210px;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  font-family:var(--lsr-mono);
  font-size:7px;
  letter-spacing:.12em;
  color:rgba(244,245,247,.48);
}
.lsr-hero-code b{font-size:11px;color:#fff;letter-spacing:.03em}

.lsr-feed{
  min-height:376px;
  display:flex;
  flex-direction:column;
  padding:17px;
}
.lsr-feed-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.lsr-feed-title{display:flex;flex-direction:column;gap:3px}
.lsr-feed-title b{font-size:13px}
.lsr-feed-title span{font-family:var(--lsr-mono);font-size:7px;color:var(--lsr-muted);letter-spacing:.12em}
.lsr-feed-list{display:flex;flex-direction:column;gap:8px;min-height:0}
.lsr-feed-item{
  position:relative;
  min-height:82px;
  border:1px solid var(--lsr-line);
  border-radius:10px;
  background:rgba(255,255,255,.024);
  overflow:hidden;
  display:grid;
  grid-template-columns:96px minmax(0,1fr) 26px;
  align-items:center;
  cursor:pointer;
  transition:background .16s,border-color .16s,transform .16s;
}
.lsr-feed-item:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.15);transform:translateX(-2px)}
.lsr-feed-thumb{align-self:stretch;min-height:80px;position:relative}
.lsr-feed-thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(16,19,24,.6))}
.lsr-feed-copy{min-width:0;padding:10px 6px 10px 10px}
.lsr-feed-copy b{display:block;font-size:11px;font-weight:670}
.lsr-feed-copy > span{display:block;margin-top:4px;font-family:var(--lsr-mono);font-size:7px;color:var(--lsr-muted);letter-spacing:.05em}
.lsr-feed-meta{display:flex;align-items:center;gap:7px;margin-top:8px}
.lsr-feed-meta i{font-style:normal;font-family:var(--lsr-mono);font-size:6.5px;color:rgba(244,245,247,.48)}
.lsr-feed-chev{width:14px;height:14px;color:var(--lsr-faint)}
.lsr-feed-more{margin-top:auto;padding-top:10px}

}

.lsr-driver-value{display:flex;align-items:baseline;gap:7px}

.lsr-meter{height:4px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:4px}

/* ---------- races listing ---------- */

  font-family:var(--lsr-mono);
  font-size:7px;
  font-weight:700;

}
.lsr-filter:hover{color:#fff;background:rgba(255,255,255,.05)}
.lsr-filter.is-active{background:var(--lsr-text);border-color:var(--lsr-text);color:#0b0d10}
.lsr-filter-spacer{flex:1}

  position:absolute;
  left:11px;bottom:10px;
  font-family:var(--lsr-mono);font-size:7px;font-weight:700;letter-spacing:.12em;

.lsr-race-copy{min-width:0;padding:15px 14px 13px 10px;display:flex;flex-direction:column}

.lsr-race-title{margin-top:10px;font-size:15px;font-weight:720;letter-spacing:-.025em}
.lsr-race-meta{margin-top:5px;font-size:8.5px;color:var(--lsr-muted);line-height:1.45}
.lsr-race-stats{display:flex;align-items:flex-end;gap:15px;margin-top:auto;padding-top:13px}
.lsr-race-stat{display:flex;flex-direction:column;gap:2px}
.lsr-race-stat span{font-family:var(--lsr-mono);font-size:6px;letter-spacing:.12em;color:var(--lsr-faint);text-transform:uppercase}

.lsr-race-arrow{margin-left:auto;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--lsr-line);color:var(--lsr-muted)}
.lsr-race-arrow svg{width:13px;height:13px}

/* ---------- race detail ---------- */
.lsr-backline{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.lsr-backline .lsr-btn{min-height:32px;padding:0 10px}
.lsr-backline-copy{min-width:0}
.lsr-backline-copy b{display:block;font-size:13px}
.lsr-backline-copy span{display:block;margin-top:2px;font-family:var(--lsr-mono);font-size:7px;letter-spacing:.1em;color:var(--lsr-muted)}
.lsr-detail-grid{display:grid;grid-template-columns:minmax(0,1.48fr) minmax(280px,.82fr);gap:12px}
.lsr-detail-main{min-height:482px}
.lsr-detail-visual{height:238px;position:relative;overflow:hidden}
.lsr-detail-visual::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,9,12,.78),rgba(7,9,12,.08) 65%),linear-gradient(0deg,rgba(7,9,12,.83),transparent 60%)}
.lsr-detail-head{position:absolute;left:20px;bottom:18px;right:245px}

.lsr-intel{margin-top:13px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lsr-intel-box{min-height:86px;padding:12px 13px;border:1px solid var(--lsr-line);border-radius:10px;background:rgba(255,255,255,.02)}

.lsr-riskline{display:flex;align-items:center;gap:7px;margin-top:11px}

.lsr-part-head{display:flex;align-items:center;justify-content:space-between;margin-top:15px;margin-bottom:8px}
.lsr-part-head b{font-size:11px}
.lsr-part-head span{font-family:var(--lsr-mono);font-size:7px;color:var(--lsr-muted)}
.lsr-participants{display:flex;flex-direction:column;gap:5px}
.lsr-participant{height:35px;padding:0 8px;border:1px solid transparent;border-radius:8px;display:grid;grid-template-columns:20px 25px minmax(0,1fr) auto;align-items:center;gap:7px;font-size:9px;color:rgba(244,245,247,.65)}
.lsr-participant.is-me{border-color:rgba(255,255,255,.1);background:rgba(255,255,255,.045);color:#fff}
.lsr-participant-rank{font-family:var(--lsr-mono);font-size:7px;color:var(--lsr-faint);text-align:center}

.lsr-ready{font-family:var(--lsr-mono);font-size:6px;letter-spacing:.08em;color:var(--lsr-green)}

.lsr-side-actions{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:13px}
.lsr-side-note{text-align:center;font-family:var(--lsr-mono);font-size:6.5px;line-height:1.5;color:var(--lsr-faint);letter-spacing:.06em}

/* ---------- map ---------- */
.lsr-map-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,.7fr);gap:12px;min-height:552px}
.lsr-map-card{position:relative;overflow:hidden;min-height:552px;background:#0c1014}
.lsr-map-card::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 70% 30%,rgba(255,64,84,.08),transparent 24%),
    linear-gradient(33deg,transparent 46%,rgba(255,255,255,.025) 47%,transparent 48%),
    linear-gradient(-28deg,transparent 43%,rgba(255,255,255,.022) 44%,transparent 45%),
    #0c1014;
}
.lsr-map-grid{position:absolute;inset:0;opacity:.2;background-image:linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px);background-size:35px 35px;transform:perspective(700px) rotateX(2deg) scale(1.12)}
.lsr-map-roads{position:absolute;inset:0;width:100%;height:100%}

.lsr-map-node{position:absolute;width:20px;height:20px;border-radius:50%;border:2px solid #fff;background:var(--lsr-red);box-shadow:0 0 0 5px rgba(255,64,84,.14);cursor:pointer;transition:transform .18s}
.lsr-map-node:hover{transform:scale(1.2)}
.lsr-map-node::after{content:attr(data-label);position:absolute;left:26px;top:1px;white-space:nowrap;font-family:var(--lsr-mono);font-size:7px;letter-spacing:.08em;color:#fff;text-shadow:0 2px 5px #000}
.lsr-map-node.n1{left:18%;top:30%}.lsr-map-node.n2{left:54%;top:21%}.lsr-map-node.n3{left:69%;top:56%}.lsr-map-node.n4{left:35%;top:70%}
.lsr-map-overlay{position:absolute;left:14px;top:14px;display:flex;gap:7px}
.lsr-map-coord{position:absolute;right:14px;bottom:13px;font-family:var(--lsr-mono);font-size:7px;letter-spacing:.12em;color:var(--lsr-faint)}
.lsr-map-side{display:flex;flex-direction:column;gap:9px}
.lsr-map-event{min-height:92px;padding:12px;cursor:pointer;transition:border-color .16s,background .16s,transform .16s}
.lsr-map-event:hover{border-color:rgba(255,255,255,.18);background:var(--lsr-panel-2);transform:translateX(-2px)}
.lsr-map-event-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lsr-map-event h3{margin:9px 0 4px;font-size:12px}
.lsr-map-event p{margin:0;font-family:var(--lsr-mono);font-size:7px;color:var(--lsr-muted);letter-spacing:.06em}
.lsr-scan-card{padding:13px;margin-top:auto}
.lsr-scan-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lsr-scan-row b{font-size:10px}.lsr-scan-row span{font-family:var(--lsr-mono);font-size:7px;color:var(--lsr-red)}
.lsr-scan-wave{height:32px;margin-top:9px;display:flex;align-items:center;gap:3px;overflow:hidden}
.lsr-scan-wave i{width:3px;border-radius:3px;background:rgba(255,64,84,.55);animation:lsr-wave 1.4s ease-in-out infinite}
.lsr-scan-wave i:nth-child(1){height:8px}.lsr-scan-wave i:nth-child(2){height:19px;animation-delay:.1s}.lsr-scan-wave i:nth-child(3){height:12px;animation-delay:.2s}.lsr-scan-wave i:nth-child(4){height:26px;animation-delay:.3s}.lsr-scan-wave i:nth-child(5){height:15px;animation-delay:.4s}.lsr-scan-wave i:nth-child(6){height:22px;animation-delay:.5s}.lsr-scan-wave i:nth-child(7){height:10px;animation-delay:.6s}.lsr-scan-wave i:nth-child(8){height:28px;animation-delay:.7s}.lsr-scan-wave i:nth-child(9){height:14px;animation-delay:.8s}.lsr-scan-wave i:nth-child(10){height:21px;animation-delay:.9s}.lsr-scan-wave i:nth-child(11){height:8px;animation-delay:1s}.lsr-scan-wave i:nth-child(12){height:18px;animation-delay:1.1s}
@keyframes lsr-wave{50%{opacity:.28;transform:scaleY(.58)}}

/* ---------- garage ---------- */
.lsr-garage-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.75fr);gap:12px;min-height:552px}
.lsr-car-stage{position:relative;min-height:552px;overflow:hidden}

.lsr-car-stage::after{content:"";position:absolute;left:-12%;right:-12%;bottom:88px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,64,84,.55),transparent);box-shadow:0 0 26px rgba(255,64,84,.25)}
.lsr-car-stage-head{position:absolute;left:20px;top:19px;right:20px;display:flex;justify-content:space-between;align-items:flex-start}
.lsr-car-name h1{margin:8px 0 4px;font-size:30px;letter-spacing:-.055em;text-transform:uppercase}
.lsr-car-name p{margin:0;font-family:var(--lsr-mono);font-size:7px;color:var(--lsr-muted);letter-spacing:.09em}
.lsr-class-big{width:58px;height:58px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:rgba(128,173,255,.12);border:1px solid rgba(128,173,255,.32);font-family:var(--lsr-mono);font-size:27px;font-weight:760;color:#c3d3ff}

.lsr-specbar{height:4px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.lsr-specbar i{height:100%;display:block;background:linear-gradient(90deg,#fff,var(--lsr-red));border-radius:inherit}
.lsr-garage-side{display:flex;flex-direction:column;gap:9px}

/* ---------- profile ---------- */
.lsr-profile-grid{display:grid;grid-template-columns:310px minmax(0,1fr);gap:12px;min-height:552px}
.lsr-driver-card{padding:18px;display:flex;flex-direction:column}
.lsr-driver-card-top{display:flex;align-items:center;gap:13px}
.lsr-avatar.is-large{width:66px;height:66px;font-size:20px;border-radius:17px}
.lsr-driver-id h1{margin:0;font-size:22px;letter-spacing:-.04em}.lsr-driver-id p{margin:4px 0 0;font-family:var(--lsr-mono);font-size:7px;color:var(--lsr-muted);letter-spacing:.1em}
.lsr-driver-rank{margin-top:17px;padding:14px;border:1px solid var(--lsr-line);border-radius:10px;background:rgba(255,255,255,.025)}
.lsr-rank-top{display:flex;align-items:flex-end;justify-content:space-between}.lsr-rank-top span{font-family:var(--lsr-mono);font-size:7px;letter-spacing:.12em;color:var(--lsr-muted)}.lsr-rank-top b{font-family:var(--lsr-mono);font-size:16px}
.lsr-rank-title{margin-top:10px;font-size:12px;font-weight:700}.lsr-rank-sub{margin-top:3px;font-size:8px;color:var(--lsr-muted)}
.lsr-profile-numbers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.lsr-profile-number{padding:11px;border:1px solid var(--lsr-line);border-radius:9px;background:rgba(255,255,255,.018)}
.lsr-profile-number span{display:block;font-family:var(--lsr-mono);font-size:6px;letter-spacing:.12em;color:var(--lsr-faint);text-transform:uppercase}.lsr-profile-number b{display:block;margin-top:5px;font-family:var(--lsr-mono);font-size:13px}
.lsr-crewbox{margin-top:auto;padding:12px;border-left:2px solid var(--lsr-red);background:linear-gradient(90deg,rgba(255,64,84,.1),transparent)}
.lsr-crewbox span{font-family:var(--lsr-mono);font-size:6px;letter-spacing:.12em;color:#ff9ba5}.lsr-crewbox b{display:block;margin-top:5px;font-size:11px}.lsr-crewbox p{margin:3px 0 0;font-size:8px;color:var(--lsr-muted)}
.lsr-profile-main{display:flex;flex-direction:column;gap:10px}
.lsr-career{padding:15px;min-height:238px}
.lsr-career-head{display:flex;align-items:center;justify-content:space-between}.lsr-career-head b{font-size:12px}.lsr-career-head span{font-family:var(--lsr-mono);font-size:7px;color:var(--lsr-green)}
.lsr-chart{height:132px;margin-top:16px;position:relative;border-bottom:1px solid var(--lsr-line);background:repeating-linear-gradient(to top,transparent 0 32px,rgba(255,255,255,.035) 33px 34px)}

.lsr-achievement-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--lsr-red-soft);color:#ff8894;border:1px solid rgba(255,64,84,.2)}.lsr-achievement-icon svg{width:17px;height:17px}

  function renderChrome() {
    if (!root) return;
    var meta = VIEW_META[currentView] || VIEW_META.home;
    if (pageTitleEl) pageTitleEl.textContent = meta.title;
    if (kickerEl) kickerEl.textContent = meta.kicker;

    var buttons = root.querySelectorAll(".lsr-nav-btn");
    for (var i = 0; i < buttons.length; i++) {
      var target = buttons[i].getAttribute("data-nav");
      var activeView = currentView === "detail" ? "races" : currentView;
      buttons[i].classList.toggle("is-active", target === activeView);
    }

    if (profileEl && state) {
      var driver = state.driver || {};
      profileEl.innerHTML = '<div class="lsr-avatar">' + esc(initials(driver.name || "LucasM")) + '</div>' +
        '<div class="lsr-profile-copy"><b>' + esc(driver.name || "Unknown") + '</b><span>' + esc(driver.id || "MASKED") + '</span></div>';
    }

    var relay = root.querySelector('[data-role="relay"]');
    if (relay && state) relay.textContent = esc((state.network.relay || "RELAY LS-08") + " / " + (state.network.latency || 18) + "MS");

  function setView(next, payload) {
    if (!VIEW_META[next]) next = "home";

    closeSheet(true);
    renderChrome();
    renderView();
  }

  function renderView() {
    if (!viewEl) return;
    if (!state) { renderLoading(); return; }
    if (state.configured === false) { renderOffline(); return; }

    if (currentView === "home") renderHome();
    else if (currentView === "races") renderRaces();
    else if (currentView === "detail") renderDetail();
    else if (currentView === "map") renderMap();
    else if (currentView === "garage") renderGarage();
    else if (currentView === "profile") renderProfile();
    else renderHome();
    tickClocks();
  }

  function renderLoading() {
    viewEl.innerHTML = '<div class="lsr-centerstate"><div class="lsr-loader"></div><h2>Decrypting night grid</h2><p>Verifying driver key, local relay and active race signals.</p></div>';
  }

  function renderOffline() {
    viewEl.innerHTML = '<div class="lsr-centerstate lsr-view-enter"><div class="lsr-offline-mark">' + icon("radar") + '</div><h2>LSR relay is dark</h2><p>The interface is installed, but the race backend has not been connected yet. The standalone preview contains the complete interactive design without putting fake race data on the game server.</p></div>';
  }

    if (!state.events.length) return null;
    var preferred = eventById(state.featuredEventId);
    return preferred || state.events[0];
  }

    if (!ev) { renderEmptyRaces(); return; }

      '<section class="lsr-hero">' +
        '<div class="lsr-hero-media lsr-photo" data-photo="' + esc(ev.photo || "night") + '"></div>' +

          '</div>' +
          '<div class="lsr-hero-actions"><button class="lsr-btn is-primary" data-open-event="' + esc(ev.id) + '">Open race file ' + icon("arrow") + '</button><button class="lsr-btn" data-action="bookmark" data-event-id="' + esc(ev.id) + '">' + icon("bookmark") + (isBookmarked(ev.id) ? "Saved" : "Save route") + '</button></div>' +
        '</div>' +
        '<div class="lsr-route-card">' + routeSvg(ev) + '</div>' +

      '</section>' +
      '<aside class="lsr-card lsr-feed">' +
        '<div class="lsr-feed-head"><div class="lsr-feed-title"><b>Signal queue</b><span>' + state.events.length + ' VERIFIED EVENTS</span></div>' + tag("LIVE", "is-green") + '</div>' +

        '<div class="lsr-driver-cell"><span class="lsr-driver-label">Street reputation</span><div class="lsr-driver-value"><b>' + esc(driver.rep || 0) + '</b><span>/ ' + esc(driver.repTarget || 0) + ' REP</span></div><div class="lsr-meter"><i style="width:' + repPercent(driver) + '%"></i></div></div>' +

      '</section>' +

  function heroTitle(title) {
    var words = String(title || "Night Run").split(" ");

  function repPercent(driver) {

      '<section class="lsr-profile-main">' +
        '<div class="lsr-card lsr-career"><div class="lsr-career-head"><b>Reputation velocity</b><span>+' + esc(d.weeklyRep || 0) + ' THIS WEEK</span></div>' + chartSvg() + '<div class="lsr-chart-labels"><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span><span>NOW</span></div></div>' +
        '<div class="lsr-achievements">' + achievement("trophy", "After Hours", "Win three races after midnight without a restart.", "COMPLETED") + achievement("shield", "No Trace", "Finish five high-risk events without maximum heat.", "4 / 5") + achievement("bolt", "Redline", "Hold first position through a complete final sector.", "COMPLETED") + '</div>' +
      '</section>' +
    '</div></div>';
    viewEl.innerHTML = html;
  }

  function profileNumber(label, value) {
    return '<div class="lsr-profile-number"><span>' + esc(label) + '</span><b>' + esc(value || 0) + '</b></div>';
  }

  function chartSvg() {
    return '<div class="lsr-chart"><svg viewBox="0 0 600 130" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="lsr-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4054" stop-opacity=".24"/><stop offset="1" stop-color="#ff4054" stop-opacity="0"/></linearGradient></defs><path class="area" d="M0 110 C80 105 92 76 150 83 S220 96 270 58 S360 77 410 42 S505 55 600 18 L600 130 L0 130Z"/><path d="M0 110 C80 105 92 76 150 83 S220 96 270 58 S360 77 410 42 S505 55 600 18"/></svg></div>';
  }

  function achievement(glyph, title, desc, progress) {
    return '<div class="lsr-card lsr-achievement"><div class="lsr-achievement-icon">' + icon(glyph) + '</div><b>' + esc(title) + '</b><p>' + esc(desc) + '</p><span>' + esc(progress) + '</span></div>';
  }

  function openJoinSheet(ev) {
    if (!ev || !modalHost) return;
    modalHost.innerHTML = '<div class="lsr-backdrop" data-action="close-sheet"></div><section class="lsr-sheet" role="dialog" aria-modal="true">' +
      '<header class="lsr-sheet-head"><div class="lsr-sheet-head-copy"><b>Join staging</b><span>' + esc(ev.code) + ' / ENCRYPTED ENTRY</span></div><button class="lsr-icon-btn lsr-sheet-close" data-action="close-sheet">' + icon("x") + '</button></header>' +
      '<div class="lsr-sheet-body"><div class="lsr-sheet-summary"><h3>' + esc(ev.title) + '</h3><p>' + esc(ev.district) + ' / ' + esc(ev.type) + ' / ' + esc(ev.distance) + ' km / ' + esc(ev.class) + ' class</p></div>' +
        '<div class="lsr-sheet-summary"><div class="lsr-sheet-line"><span>Entry buy-in</span><b>' + money(ev.buyIn) + '</b></div><div class="lsr-sheet-line"><span>Projected pot</span><b>' + money(ev.pot) + '</b></div><div class="lsr-sheet-line"><span>Patrol risk</span><b>' + ev.risk + ' / 5</b></div><div class="lsr-sheet-line"><span>Your machine</span><b>' + esc(state.car.name) + ' / ' + esc(state.car.class) + '</b></div></div>' +
        '<div class="lsr-disclaimer">Your driver tag becomes visible to the organizer and staged drivers. Leaving after the grid locks may forfeit the entry.</div>' +
        '<div class="lsr-sheet-actions"><button class="lsr-btn is-danger is-wide" data-action="confirm-join" data-event-id="' + esc(ev.id) + '">Confirm entry ' + icon("arrow") + '</button><button class="lsr-btn is-quiet is-wide" data-action="close-sheet">Stay off-grid</button></div>' +
      '</div></section>';
    modalHost.classList.add("is-open");
  }

  function openCreateSheet() {
    if (!modalHost) return;
    modalHost.innerHTML = '<div class="lsr-backdrop" data-action="close-sheet"></div><section class="lsr-sheet" role="dialog" aria-modal="true">' +
      '<header class="lsr-sheet-head"><div class="lsr-sheet-head-copy"><b>Broadcast a private run</b><span>LOCAL RELAY / INVITE-ONLY</span></div><button class="lsr-icon-btn lsr-sheet-close" data-action="close-sheet">' + icon("x") + '</button></header>' +
      '<div class="lsr-sheet-body"><div class="lsr-sheet-summary"><h3>Downtown blackout</h3><p>Preset city sprint through Mission Row and Textile City. A class, live traffic, 12 driver cap.</p></div>' +
        '<div class="lsr-sheet-summary"><div class="lsr-sheet-line"><span>Route preset</span><b>DT-09</b></div><div class="lsr-sheet-line"><span>Suggested buy-in</span><b>$4,000</b></div><div class="lsr-sheet-line"><span>Start window</span><b>+15 MIN</b></div><div class="lsr-sheet-line"><span>Trace policy</span><b>AUTO SCRUB</b></div></div>' +
        '<div class="lsr-disclaimer">This preview uses a preset so the interaction can be tested without a keyboard. Production creation can be connected to your race backend and route editor.</div>' +
        '<div class="lsr-sheet-actions"><button class="lsr-btn is-danger is-wide" data-action="publish">Broadcast run ' + icon("radar") + '</button><button class="lsr-btn is-quiet is-wide" data-action="close-sheet">Cancel</button></div>' +
      '</div></section>';
    modalHost.classList.add("is-open");
  }

  function closeSheet(immediate) {
    if (!modalHost || !modalHost.classList.contains("is-open")) return false;
    modalHost.classList.remove("is-open");
    if (immediate) modalHost.innerHTML = "";
    else setTimeout(function () { if (modalHost && !modalHost.classList.contains("is-open")) modalHost.innerHTML = ""; }, 360);
    return true;
  }

  function onClick(e) {
    var t = e.target.closest("[data-nav],[data-open-event],[data-filter],[data-action]");
    if (!t || !root || !root.contains(t)) return;

    var nav = t.getAttribute("data-nav");
    if (nav) { setView(nav); return; }

    var eventId = t.getAttribute("data-open-event");
    if (eventId) { setView("detail", { eventId: eventId }); return; }

    var f = t.getAttribute("data-filter");
    if (f) { filter = f; renderRaces(); return; }

    var action = t.getAttribute("data-action");
    var id = t.getAttribute("data-event-id");
    if (action === "create") { openCreateSheet(); return; }
    if (action === "close-sheet") { closeSheet(); return; }
    if (action === "join") {
      var ev = eventById(id);
      if (!ev) return;
      if (isJoined(id)) { act("leave", { eventId: id }); return; }
      openJoinSheet(ev); return;
    }
    if (action === "confirm-join") {
      closeSheet();
      act("join", { eventId: id }).then(function () { setView("detail", { eventId: id }); });
      return;
    }
    if (action === "bookmark") { act("bookmark", { eventId: id }); return; }
    if (action === "ready") { act("ready", {}); return; }
    if (action === "publish") { closeSheet(); act("publish", {}).then(function (res) { if (res && !res.error) setView("races"); }); return; }
    if (action === "copy-build") {
      var code = state.car.buildCode || "LSR-A-783-R03";
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).catch(function () {});
      toast("Build code copied"); return;
    }
    if (action === "notifications") { toast("No unread race signals"); return; }
  }

  function tickClocks() {
    if (!root) return;
    var clocks = root.querySelectorAll(".js-countdown[data-until]");
    for (var i = 0; i < clocks.length; i++) {
      var remaining = Math.max(0, Number(clocks[i].getAttribute("data-until")) - Date.now());
      var total = Math.floor(remaining / 1000);
      var minutes = Math.floor(total / 60);
      var seconds = total % 60;
      clocks[i].textContent = minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
    }
  }

  MOS.registerApp({
    id: "lsr",
    name: "Los Santos Racing",
    icon: "icons/lsr.png",
    open: function (rootDiv) {
      root = rootDiv;
      state = null;
      currentView = "home";
      filter = "ALL";
      selectedEventId = null;
      buildShell();
      renderChrome();
      renderView();
      clickHandler = onClick;
      root.addEventListener("click", clickHandler);
      request("boot").then(function (res) {
        if (!root) return;
        if (res && res.state) state = normalizeState(clone(res.state));
        else state = normalizeState({ configured: false });
        renderChrome();
        renderView();
      });
      clockTimer = setInterval(tickClocks, 1000);
    },
    close: function () {
      if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
      if (root && clickHandler) root.removeEventListener("click", clickHandler);
      root = null;
      viewEl = null;
      modalHost = null;
      pageTitleEl = null;
      kickerEl = null;
      profileEl = null;
      state = null;
      clickHandler = null;
    },
    push: function (event, payload) {
      if (event === "state" && payload && payload.state) {
        state = normalizeState(payload.state);
        renderChrome();
        renderView();
      }
    },
    back: function () {
      if (closeSheet()) return true;
      if (currentView === "detail") { setView("races"); return true; }
      if (currentView !== "home") { setView("home"); return true; }
      return false;
    }
  });
})();
</script>
<script>setTimeout(function(){window.__openLSR();},260);</script>
